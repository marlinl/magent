strict: true
baseline: .swiftlint-baseline.json

included:
  - Sources
  - Tests

excluded:
  - .build

line_length:
  warning: 120
  error: 120

file_length:
  warning: 1500
  error: 2000

type_body_length:
  warning: 550
  error: 700

nesting:
  ignore_typealiases_and_associatedtypes: true

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 25
  error: 50

reporter: xcode
